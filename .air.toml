root = "."
testdata_dir = "testdata"
tmp_dir = ".air"

[build]
bin = "./.air/controlroom"
cmd = "go build -o ./.air/controlroom ./cmd/controlroom"
delay = 500
exclude_dir = [".air", ".github", "deploy", "docs", "scripts", "testdata", "web/node_modules", "web/dist"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
follow_symlink = false
include_ext = ["go", "tpl", "tmpl", "html"]
kill_delay = "0s"
log = "build-errors.log"
send_interrupt = true
stop_on_error = false

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
