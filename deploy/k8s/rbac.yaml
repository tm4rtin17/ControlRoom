apiVersion: v1
kind: ServiceAccount
metadata:
  name: controlroom
  namespace: controlroom

---
# Phase A: read-only access to core cluster resources.
# Phase B widens with pods/log so the SPA can stream container output.
# Phase C will widen further for write actions; do NOT add secrets,
# persistentvolumes, or any write verb here yet.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controlroom-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - configmaps
      - events
      - endpoints
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: [get]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controlroom-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: controlroom-reader
subjects:
  - kind: ServiceAccount
    name: controlroom
    namespace: controlroom
