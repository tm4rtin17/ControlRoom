apiVersion: v1
kind: Service
metadata:
  name: controlroom
  namespace: controlroom
  labels:
    app.kubernetes.io/name: controlroom
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: controlroom
  ports:
    - name: https
      port: 443        # Ingress → Service on 443
      targetPort: 8443 # Pod listens on 8443
      protocol: TCP
